<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreeJS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="border"></div>
    <div class="editpanel">
        Detail:
        <input type="range" id="detail" name="detail" min="1" max="50" value="5" step="1"> <br>
        Height:
        <input type="range" id="height" name="height" min="0" max="5" value="1" step="0.01"> <br>
        Noise Scale:
        <input type="range" id="scale" name="scale" min="0" max="0.5" value="0.2" step="0.005"> <br>
        Octaves:
        <input type="range" id="octaves" name="octaves" min="1" max="8" value="4" step="1"> <br>
        Water Level:
        <input type="range" id="water_level" name="water_level" min="-3" max="3" value="0" step="0.01"> <br>
        Wave Amplitude:
        <input type="range" id="amplitude" name="amplitude" min="0" max="0.5" value="0.1" step="0.01"> <br>
        Wave Frequency:
        <input type="range" id="frequency" name="frequency" min="0" max="2" value="1.0" step="0.01"> <br>
        Wave Speed:
        <input type="range" id="speed" name="speed" min="0" max="1" value="0.2" step="0.01"> <br>
        Render Mode:
        <select id="render_mode" name="render_mode">
            <option value="lit" selected>Lit</option>
            <option value="flat">Flat</option>
            <option value="wireframe">Wireframe</option>
            <option value="normal">Normal</option>
        </select> <br>
        Sun Color:
        <input type="color" id="sun_color" name="sun_color" value="#fdf3c4"> <br>
        Sun Intensity:
        <input type="range" id="sun_intensity" name="sun_intensity" min="0" max="2" value="2.0" step="0.01"> <br>
        Land Color:
        <input type="color" id="land_color" name="land_color" value="#a2f141"> <br>
        Water Color:
        <input type="color" id="water_color" name="water_color" value="#043cfb"> <br>
    </div>
    
    <script type="module" src="script.js"></script>
</body>
</html>
