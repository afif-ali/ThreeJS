<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreeJS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="canvas"></canvas>
    <script type="module" src="script.js"></script>

    <div class="border"></div>
    <div class="editpanel">
        Height:
        <input type="range" id="height" name="height" min="0" max="5" value="1" step="0.01"> <br>
        Noise Scale:
        <input type="range" id="scale" name="scale" min="0" max="0.5" value="0.2" step="0.005"> <br>
        Detail:
        <input type="range" id="detail" name="detail" min="1" max="50" value="20" step="1"> <br>
        Octave:
        <input type="range" id="octave" name="octave" min="1" max="5" value="1" step="1"> <br>
        Water Level:
        <input type="range" id="water_level" name="water_level" min="-5" max="3" value="0" step="0.01"> <br>
        Render Mode:
        <select id="render_mode" name="render_mode">
            <option value="lit">Lit</option>
            <option value="normal" selected>Normal</option>
            <option value="flat">Flat</option>
            <option value="wireframe">Wireframe</option>
        </select> <br>
        Sun Color:
        <input type="color" id="sun_color" name="sun_color" value="#ffffff"> <br>
        Sun Intensity:
        <input type="range" id="sun_intensity" name="sun_intensity" min="0" max="1" value="0.5" step="0.01"> <br>

    </div>

</body>
</html>
